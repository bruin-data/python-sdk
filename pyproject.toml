[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bruin-sdk"
version = "0.1.0"
description = "Python SDK for Bruin CLI — query databases, parse context, and access connections with zero boilerplate."

license = "Apache-2.0"
requires-python = ">=3.9"
authors = [{ name = "Bruin Team" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = ["pandas"]

[project.optional-dependencies]
bigquery = ["google-cloud-bigquery", "google-auth", "db-dtypes"]
snowflake = ["snowflake-connector-python"]
postgres = ["psycopg2-binary"]
mssql = ["pymssql"]
mysql = ["mysql-connector-python"]
duckdb = ["duckdb"]
redshift = ["psycopg2-binary"]
sheets = ["pygsheets", "google-auth"]
all = [
    "bruin-sdk[bigquery]",
    "bruin-sdk[snowflake]",
    "bruin-sdk[postgres]",
    "bruin-sdk[mssql]",
    "bruin-sdk[mysql]",
    "bruin-sdk[duckdb]",
    "bruin-sdk[redshift]",
    "bruin-sdk[sheets]",
]
dev = ["pytest", "pytest-cov"]

[tool.hatch.build.targets.wheel]
packages = ["src/bruin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
