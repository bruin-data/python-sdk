[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bruin-sdk"
version = "0.2.1"
description = "Python SDK for Bruin CLI — query databases, parse context, and access connections with zero boilerplate."
readme = "docs/README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [{ name = "Bruin Team" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = ["pandas"]

[project.urls]
Homepage = "https://github.com/bruin-data/bruin"
Repository = "https://github.com/bruin-data/bruin-python"
Documentation = "https://docs.getbruin.com"

[project.optional-dependencies]
bigquery = ["google-cloud-bigquery", "google-auth", "db-dtypes"]
snowflake = ["snowflake-connector-python"]
postgres = ["psycopg2-binary"]
mssql = ["pymssql"]
mysql = ["mysql-connector-python"]
duckdb = ["duckdb"]
redshift = ["psycopg2-binary"]
sheets = ["pygsheets", "google-auth"]
databricks = ["databricks-sql-connector"]
clickhouse = ["clickhouse-connect"]
athena = ["pyathena"]
trino = ["trino"]
motherduck = ["duckdb"]
synapse = ["pymssql"]
all = [
    "bruin-sdk[bigquery]",
    "bruin-sdk[snowflake]",
    "bruin-sdk[postgres]",
    "bruin-sdk[mssql]",
    "bruin-sdk[mysql]",
    "bruin-sdk[duckdb]",
    "bruin-sdk[redshift]",
    "bruin-sdk[sheets]",
    "bruin-sdk[databricks]",
    "bruin-sdk[clickhouse]",
    "bruin-sdk[athena]",
    "bruin-sdk[trino]",
    "bruin-sdk[motherduck]",
    "bruin-sdk[synapse]",
]
dev = ["pytest", "pytest-cov"]

[tool.hatch.build.targets.wheel]
packages = ["src/bruin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
